<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요즘 환생 직업</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            color: #1f2937;
        }
        .container {
            max-width: 768px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .btn:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }
        .btn-secondary {
            background-color: #f3f4f6;
            color: #6b7280;
            box-shadow: none;
        }
        .btn-secondary:hover {
            background-color: #e5e7eb;
            transform: translateY(-2px);
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .input-group label {
            font-weight: bold;
            color: #4b5563;
        }
        .input-group input, .input-group select {
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            transition: border-color 0.3s;
            font-size: 1rem;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }
        .question-box {
            padding: 1.5rem;
            border-radius: 15px;
            border: 1px solid #e5e7eb;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }
        .question-box:hover {
            border-color: #3b82f6;
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.1);
        }
        input[type="radio"] {
            accent-color: #3b82f6;
        }
        .result-box {
            background-color: #e3f2fd;
            border: 2px solid #64b5f6;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
        }
        .result-box h3 {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1e88e5;
            margin-bottom: 0.5rem;
        }
        .message-box {
            background-color: #fff3e0;
            color: #ff9800;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            margin-top: 1rem;
            text-align: center;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .message-box.show {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-blue-50 flex items-center justify-center p-8">
    <div class="container mx-auto p-6 bg-white rounded-3xl shadow-2xl space-y-8 animate-fadeIn">
        
        <!-- Screen 1: Intro and Saju Input -->
        <div id="intro-screen" class="text-center space-y-6">
            <h1 class="text-4xl md:text-5xl font-bold text-gray-800">요즘 환생 직업</h1>
            <p class="text-gray-600 text-lg md:text-xl">
                너에 대해 알려주면, 내가 직업을 정해줄게
            </p>
            <div class="input-section mt-6">
                <div class="input-group">
                    <label for="birth-year">출생 연도</label>
                    <input type="number" id="birth-year" placeholder="예: 1990" class="w-full">
                </div>
                <div class="input-group">
                    <label for="birth-month">출생 월</label>
                    <input type="number" id="birth-month" placeholder="1 ~ 12" class="w-full">
                </div>
                <div class="input-group">
                    <label for="birth-day">출생 일</label>
                    <input type="number" id="birth-day" placeholder="1 ~ 31" class="w-full">
                </div>
                <div class="input-group">
                    <label for="birth-hour">출생 시 (24시 기준)</label>
                    <input type="number" id="birth-hour" placeholder="0 ~ 23" class="w-full">
                </div>
                <div id="saju-message" class="message-box hidden"></div>
                <button id="saju-next-btn" class="btn w-full mt-4">다음</button>
            </div>
        </div>

        <!-- Screen 2: Quiz -->
        <div id="quiz-screen" class="hidden">
            <h2 id="question-text" class="text-2xl font-bold text-gray-800 mb-6"></h2>
            <div id="options-container" class="space-y-4"></div>
            <div id="quiz-message" class="message-box hidden"></div>
            <div class="flex justify-between mt-8">
                <button id="prev-btn" class="btn btn-secondary hidden">이전</button>
                <button id="next-btn" class="btn ml-auto">다음</button>
            </div>
        </div>

        <!-- Screen 3: Result -->
        <div id="result-screen" class="hidden text-center space-y-6">
            <div class="result-box">
                <p class="text-2xl font-semibold">당신의 종합 결과</p>
                <h3 id="result-type" class="mt-2 text-3xl md:text-5xl font-extrabold animate-pulse"></h3>
                <p id="combined-description" class="mt-4 text-base md:text-lg text-blue-900"></p>
            </div>
            <div id="result-details" class="text-left mt-8 space-y-6"></div>
            <button id="restart-btn" class="btn mt-6">다시 분석하기</button>
        </div>
    </div>

                ]
            },
            {
                question: "친구의 고민 상담을 해줄 때 당신은?",
                options: [
                    { text: "객관적인 상황 분석을 통해 논리적이고 현실적인 해결책을 제시한다.", score: { 'T': 1 } },
                    { text: "친구가 느낄 감정에 공감하며 정서적 위로를 먼저 건넨다.", score: { 'F': 1 } }
                ]
            },
            {
                question: "마감이 얼마 남지 않은 프로젝트를 진행할 때 당신은?",
                options: [
                    { text: "계획대로 순서에 맞춰 체계적으로 처리하며 중간 점검을 철저히 한다.", score: { 'J': 1 } },
                    { text: "상황에 따라 유연하게 작업 순서를 바꾸며 마감 직전까지 수정한다.", score: { 'P': 1 } }
                ]
            }
        ];

        // DOM elements
        const introScreen = document.getElementById('intro-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const sajuNextBtn = document.getElementById('saju-next-btn');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const restartBtn = document.getElementById('restart-btn');
        const sajuMessage = document.getElementById('saju-message');
        const quizMessage = document.getElementById('quiz-message');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const resultType = document.getElementById('result-type');
        const combinedDescription = document.getElementById('combined-description');
        const resultDetails = document.getElementById('result-details');

        // State variables
        let currentQuestionIndex = 0;
        let scores = { 
            '소양인': 0, '태음인': 0, '소음인': 0, '태양인': 0, '한다형': 0, '열다형': 0,
            'E': 0, 'I': 0, 'S': 0, 'N': 0, 'T': 0, 'F': 0, 'J': 0, 'P': 0
        };
        let sajuResult = '';
        let bloodTypeResult = '';

        // Event Listeners
        sajuNextBtn.addEventListener('click', handleSajuInput);
        nextBtn.addEventListener('click', handleNext);
        prevBtn.addEventListener('click', handlePrev);
        restartBtn.addEventListener('click', restartApp);

        function showMessage(msg, targetElement) {
            targetElement.textContent = msg;
            targetElement.classList.remove('hidden');
            targetElement.classList.add('show');
            setTimeout(() => {
                targetElement.classList.remove('show');
                targetElement.classList.add('hidden');
            }, 3000);
        }

        function getDayMaster(year, month, day) {
            const date = new Date(year, month - 1, day);
            const baseDate = new Date(1900, 0, 1);
            const diffInDays = Math.floor((date - baseDate) / (1000 * 60 * 60 * 24));
            const cycleIndex = (diffInDays + 2) % 60;
            const celestialStems = ['갑', '을', '병', '정', '무', '기', '경', '신', '임', '계'];
            return celestialStems[cycleIndex % 10];
        }

        function handleSajuInput() {
            const year = parseInt(document.getElementById('birth-year').value);
            const month = parseInt(document.getElementById('birth-month').value);
            const day = parseInt(document.getElementById('birth-day').value);
            const hour = parseInt(document.getElementById('birth-hour').value);

            if (isNaN(year) || isNaN(month) || isNaN(day) || isNaN(hour) || 
                month < 1 || month > 12 || day < 1 || day > 31 || hour < 0 || hour > 23) {
                showMessage('모든 정보를 정확하게 입력해주세요.', sajuMessage);
                return;
            }

            try {
                const dayMaster = getDayMaster(year, month, day);
                sajuResult = dayMasters[dayMaster];
                introScreen.classList.add('hidden');
                quizScreen.classList.remove('hidden');
                renderQuestion();
            } catch (e) {
                showMessage('분석 중 오류가 발생했습니다. 다시 시도해주세요.', sajuMessage);
                console.error(e);
            }
        }

        function renderQuestion() {
            if (currentQuestionIndex < 0) {
                currentQuestionIndex = 0;
            }
            if (currentQuestionIndex >= questions.length) {
                showResult();
                return;
            }

            const currentQuestion = questions[currentQuestionIndex];
            questionText.textContent = `Q${currentQuestionIndex + 1}. ${currentQuestion.question}`;
            optionsContainer.innerHTML = '';
            
            prevBtn.classList.toggle('hidden', currentQuestionIndex === 0);
            nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? '결과보기' : '다음';
            quizMessage.classList.add('hidden');

            currentQuestion.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.classList.add('question-box', 'flex', 'items-center', 'space-x-3', 'cursor-pointer', 'hover:border-blue-400', 'transition', 'duration-300');
                
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.id = `option${index}`;
                radio.name = `question${currentQuestionIndex}`;
                // Handle different value types for scores and blood type
                if (option.score) {
                    radio.value = JSON.stringify(option.score);
                } else if (option.bloodType) {
                    radio.value = option.bloodType;
                }
                
                radio.classList.add('w-5', 'h-5', 'cursor-pointer');
                
                const label = document.createElement('label');
                label.htmlFor = `option${index}`;
                label.textContent = option.text;
                label.classList.add('text-gray-700', 'text-lg', 'flex-grow', 'cursor-pointer');
                
                optionDiv.append(radio, label);
                optionsContainer.append(optionDiv);
                optionDiv.addEventListener('click', () => radio.checked = true);
            });
        }

        function handleNext() {
            const selectedOption = document.querySelector(`input[name="question${currentQuestionIndex}"]:checked`);
            if (selectedOption) {
                const currentQuestion = questions[currentQuestionIndex];
                if (currentQuestion.options[0].bloodType) {
                    // This is the blood type question
                    bloodTypeResult = selectedOption.value;
                } else {
                    // This is a scoring question
                    const scoreDelta = JSON.parse(selectedOption.value);
                    for (const type in scoreDelta) {
                        scores[type] += scoreDelta[type];
                    }
                }
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showMessage('답변을 선택해주세요!', quizMessage);
            }
        }

        function handlePrev() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function getMbtiResult() {
            let mbti = '';
            mbti += scores['E'] > scores['I'] ? 'E' : 'I';
            mbti += scores['S'] > scores['N'] ? 'S' : 'N';
            mbti += scores['T'] > scores['F'] ? 'T' : 'F';
            mbti += scores['J'] > scores['P'] ? 'J' : 'P';
            return mbti;
        }

        function getCombinedProfessions(professionsList) {
            const allProfessions = professionsList.flat();
            const professionCounts = allProfessions.reduce((acc, p) => {
                acc[p] = (acc[p] || 0) + 1;
                return acc;
            }, {});

            // Sort professions by how many categories they appear in
            const sortedProfessions = Object.entries(professionCounts)
                .sort(([, countA], [, countB]) => countB - countA)
                .map(([profession]) => profession);

            // Return top 3 unique professions
            return [...new Set(sortedProfessions)].slice(0, 3);
        }

        function showResult() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            // Find max score for Sa-sang and Han-yeol
            let maxSaSangScore = 0;
            let saSangResult = '';
            ['소양인', '태음인', '소음인', '태양인'].forEach(type => {
                if (scores[type] > maxSaSangScore) {
                    maxSaSangScore = scores[type];
                    saSangResult = type;
                }
            });

            let maxHanYeolScore = 0;
            let hanYeolResult = '';
            ['한다형', '열다형'].forEach(type => {
                if (scores[type] > maxHanYeolScore) {
                    maxHanYeolScore = scores[type];
                    hanYeolResult = type;
                }
            });
            
            const mbtiResult = getMbtiResult();
            const sajuData = elementsData[sajuResult];
            const saSangData = constitutions[saSangResult];
            const hanYeolData = constitutions[hanYeolResult];
            const bloodTypeDataResult = bloodTypeData[bloodTypeResult];
            const mbtiDataResult = mbtiData[mbtiResult];

            // Combine professions from all four analyses
            const combinedProfessions = getCombinedProfessions([
                sajuData.professions,
                saSangData.professions, // 사상체질 직업은 따로 없어서 제거하거나, 새로운 데이터를 추가해야 함
                bloodTypeDataResult.professions,
                mbtiDataResult.professions
            ]);

            const professionListHtml = combinedProfessions.map((p, index) => `<li class="font-bold text-lg text-gray-700">${index + 1}. ${p}</li>`).join('');

            resultType.textContent = `${sajuData.name} - ${saSangData.name} - ${bloodTypeDataResult.name} - ${mbtiResult}`;
            combinedDescription.textContent = mbtiDataResult.description;
            
            resultDetails.innerHTML = `
                <div class="space-y-4">
                    <div class="p-5 rounded-2xl bg-gray-100 border border-gray-200">
                        <h4 class="text-xl font-bold mb-2 text-gray-800">💼 당신에게 가장 유력한 직업 3가지</h4>
                        <ul class="list-disc list-inside space-y-2">
                           ${professionListHtml}
                        </ul>
                    </div>
                    <div class="p-5 rounded-2xl bg-gray-100 border border-gray-200">
                        <h4 class="text-xl font-bold mb-2 text-gray-800">✅ 분석 결과</h4>
                        <p class="text-gray-600 mt-2"><strong>음양오행:</strong> ${sajuData.description}</p>
                        <p class="text-gray-600 mt-2"><strong>사상체질:</strong> ${saSangData.name}</p>
                        <p class="text-gray-600 mt-2"><strong>혈액형:</strong> ${bloodTypeDataResult.description}</p>
                        <p class="text-gray-600 mt-2"><strong>MBTI 유형:</strong> ${mbtiDataResult.description}</p>
                    </div>
                    <div class="p-5 rounded-2xl bg-gray-100 border border-gray-200">
                        <h4 class="text-xl font-bold mb-2 text-gray-800">✅ 추천 음식</h4>
                        <p class="text-gray-600"><strong>${saSangData.name}:</strong> ${saSangData.food}</p>
                        <p class="text-gray-600 mt-2"><strong>${hanYeolData.name}:</strong> ${hanYeolData.food}</p>
                    </div>
                    <div class="p-5 rounded-2xl bg-gray-100 border border-gray-200">
                        <h4 class="text-xl font-bold mb-2 text-gray-800">🏃‍♀️ 추천 운동</h4>
                        <p class="text-gray-600"><strong>${saSangData.name}:</strong> ${saSangData.exercise}</p>
                    </div>
                    <div class="p-5 rounded-2xl bg-red-100 border-2 border-red-300">
                        <h4 class="text-xl font-bold mb-2 text-red-800">⚠️ 주의할 점</h4>
                        <p class="text-red-600"><strong>${sajuData.name}:</strong> ${sajuData.warning}</p>
                        <p class="text-red-600 mt-2"><strong>${hanYeolData.name}:</strong> ${hanYeolData.warning}</p>
                    </div>
                </div>
            `;
        }

        function restartApp() {
            resultScreen.classList.add('hidden');
            introScreen.classList.remove('hidden');
            currentQuestionIndex = 0;
            scores = { '소양인': 0, '태음인': 0, '소음인': 0, '태양인': 0, '한다형': 0, '열다형': 0,
                        'E': 0, 'I': 0, 'S': 0, 'N': 0, 'T': 0, 'F': 0, 'J': 0, 'P': 0 };
            document.getElementById('birth-year').value = '';
            document.getElementById('birth-month').value = '';
            document.getElementById('birth-day').value = '';
            document.getElementById('birth-hour').value = '';
        }
    </script>
</body>
</html>
